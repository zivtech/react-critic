schema_version: 2
id: react-05
category: async-correctness
description: A profile request can publish an obsolete response.
intentional_clean: false
public:
  file_path: src/UserProfile.tsx
  language: TypeScript JSX
  frameworks:
    react: '18.3'
  runtime: browser
  assumptions:
    - userId can change while an earlier request is pending.
    - Earlier requests may resolve after later requests.
  requirements:
    - The displayed profile must belong to the current userId.
  code: |
    function UserProfile({ userId }) {
      const [user, setUser] = useState(null);

      useEffect(() => {
        fetch(`/api/users/${userId}`)
          .then((response) => response.json())
          .then((nextUser) => setUser(nextUser));
      }, [userId]);

      return user ? <div>{user.name}</div> : <Spinner />;
    }
metadata:
  provenance:
    kind: synthetic
    origin: React effect cleanup documentation
    revision_reason: Removed the unsupported waterfall label and kept only the stated stale-publication risk.
  difficulty: HAS-BUGS
  domains: [async, effects]
  adjudication:
    status: reviewed
    method: Source-and-context rule adjudication
    reviewer: codex-test-builder-review
    reviewed_on: '2026-09-19'
    sources:
      - url: https://react.dev/reference/react/useEffect#fetching-data-with-effects
        supports: Effect data fetching needs a cleanup strategy to avoid race conditions.
    notes: Response ordering and the required displayed identity are explicit public assumptions.
    excluded_claims: [Latency, parallel fetching, retries, and unmount warnings are not scored.]
issues:
  - id: react-05-stale-response
    rule_id: react.async-correctness
    category: async-correctness
    severity: MAJOR
    description: An earlier request can call setUser after userId changes and replace the current profile with an obsolete response.
    evidence_spans:
      - lines: [5, 7]
        rationale: The effect publishes every resolved response and has no cleanup or current-request guard.
