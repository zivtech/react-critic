schema_version: 2
id: react-06
category: state-ownership
description: A shared context value is memoized and only exposes related account state.
intentional_clean: true
public:
  file_path: src/AccountProvider.tsx
  language: TypeScript JSX
  frameworks:
    react: '18.3'
  runtime: browser
  assumptions:
    - Account consumers need both user and signOut.
    - Theme and cart state are owned by separate providers.
  requirements: []
  code: |
    const AccountContext = createContext(null);

    function AccountProvider({ children }) {
      const [user, setUser] = useState(null);
      const signOut = useCallback(() => setUser(null), []);
      const value = useMemo(() => ({ user, signOut }), [user, signOut]);

      return <AccountContext.Provider value={value}>{children}</AccountContext.Provider>;
    }
