schema_version: 2
id: react-08
category: operability
description: A Suspense data path lacks the required error presentation.
intentional_clean: false
public:
  file_path: src/App.tsx
  language: TypeScript JSX
  frameworks:
    react: '18.3'
    tanstack-query: '5'
  runtime: browser
  assumptions:
    - fetchDashboard can reject.
    - useSuspenseQuery supplies data after the Suspense fallback resolves.
  requirements:
    - Dashboard request failures must show an in-app error state instead of escaping to the root.
  code: |
    function Dashboard() {
      const { data } = useSuspenseQuery({ queryKey: ['dashboard'], queryFn: fetchDashboard });
      return <RevenueChart data={data.revenue} />;
    }

    function App() {
      return (
        <Suspense fallback={<Skeleton />}>
          <Dashboard />
        </Suspense>
      );
    }
metadata:
  provenance:
    kind: synthetic
    origin: React Suspense documentation
    revision_reason: Corrected the TanStack Query result destructuring and removed the unsupported retry claim.
  difficulty: HAS-BUGS
  domains: [operability, async]
  adjudication:
    status: reviewed
    method: Source-and-context rule adjudication
    reviewer: codex-test-builder-review
    reviewed_on: '2026-09-19'
    sources:
      - url: https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary
        supports: Error boundaries provide fallback UI for rendering errors.
    notes: The requirement makes the missing failure presentation a bounded operability finding.
    excluded_claims: [Retry defaults, cache behavior, and a particular ErrorBoundary implementation are not scored.]
issues:
  - id: react-08-missing-error-presentation
    rule_id: react.operability
    category: operability
    severity: MAJOR
    description: The shown Suspense boundary provides only a loading fallback, not the required in-app error state for a rejected dashboard request.
    evidence_spans:
      - lines: [7, 8, 9]
        rationale: Dashboard is wrapped only by Suspense and no error boundary or error-state branch is shown.
