schema_version: 2
id: next-08
category: app-router-conventions
description: A blog route does not meet its required not-found behavior.
intentional_clean: false
public:
  file_path: app/blog/[slug]/page.tsx
  language: TypeScript JSX
  frameworks:
    next: '15'
    react: '19'
  runtime: nodejs
  assumptions:
    - db.post.findUnique returns null when no post has the requested slug.
  requirements:
    - An unknown slug must produce the route's not-found response.
  code: |
    export default async function BlogPost({ params }) {
      const post = await db.post.findUnique({ where: { slug: params.slug } });
      return <article>{post.content}</article>;
    }
metadata:
  provenance:
    kind: synthetic
    origin: Next.js notFound documentation
    revision_reason: Removed valid static metadata and unbounded-query preferences; retained the stated route behavior.
  difficulty: HAS-BUGS
  domains: [routing, operability]
  adjudication:
    status: reviewed
    method: Source-and-context rule adjudication
    reviewer: codex-test-builder-review
    reviewed_on: '2026-09-19'
    sources:
      - url: https://nextjs.org/docs/app/api-reference/functions/not-found
        supports: notFound renders the not-found segment and returns a 404 response.
    notes: The null result and required not-found behavior are public assumptions.
    excluded_claims: [Dynamic metadata and static-parameter sizing are not scored.]
issues:
  - id: next-08-missing-not-found
    rule_id: next.app-router-conventions
    category: app-router-conventions
    severity: MAJOR
    description: The route dereferences a possibly null post instead of producing the required not-found response.
    evidence_spans:
      - lines: [2, 3]
        rationale: findUnique can return null and post.content is rendered without a not-found branch.
