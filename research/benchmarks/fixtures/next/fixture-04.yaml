schema_version: 2
id: next-04
category: route-handler-safety
description: A password-reset route returns a request-derived account-existence error.
intentional_clean: false
public:
  file_path: app/api/auth/reset-password/route.ts
  language: TypeScript
  frameworks:
    next: '15'
  runtime: nodejs
  assumptions:
    - The route accepts unauthenticated password-reset requests.
    - Email addresses are personal account information.
  requirements:
    - The route must not reveal whether the supplied email has an account.
  code: |
    export async function POST(request: Request) {
      const { email } = await request.json();
      try {
        const user = await db.user.findUnique({ where: { email } });
        if (!user) throw new Error(`No user found with email: ${email}`);
        await sendResetEmail(user);
        return Response.json({ success: true });
      } catch (error) {
        return Response.json({ error: error.message }, { status: 500 });
      }
    }
metadata:
  provenance:
    kind: synthetic
    origin: Next.js Route Handlers documentation
    revision_reason: Removed the unsupported rate-limit claim and retained the direct response disclosure.
  difficulty: HAS-BUGS
  domains: [privacy, route-handlers]
  adjudication:
    status: reviewed
    method: Source-and-context rule adjudication
    reviewer: codex-test-builder-review
    reviewed_on: '2026-09-19'
    sources:
      - url: https://nextjs.org/docs/app/building-your-application/routing/route-handlers
        supports: Route Handlers construct HTTP responses.
    notes: The request input is interpolated into the caught error and returned in the response.
    excluded_claims: [Rate limiting, email delivery policy, and stack-trace exposure are not scored.]
issues:
  - id: next-04-account-existence-disclosure
    rule_id: next.route-handler-safety
    category: route-handler-safety
    severity: MAJOR
    description: The response returns an error stating that the request-supplied email has no account, contrary to the non-disclosure requirement.
    evidence_spans:
      - lines: [5, 9]
        rationale: The email is interpolated into an error that is returned to the caller.
