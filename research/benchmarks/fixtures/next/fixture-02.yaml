schema_version: 2
id: next-02
category: cache-correctness
description: Product data is intentionally uncached because it must reflect immediate writes.
intentional_clean: true
public:
  file_path: app/products/page.tsx
  language: TypeScript JSX
  frameworks:
    next: '15'
    react: '19'
  runtime: nodejs
  assumptions:
    - Inventory and prices can change immediately after a completed purchase.
    - This route is the canonical confirmation view following a purchase.
  requirements:
    - The confirmation view must not serve a cached inventory or price response.
  code: |
    export default async function ProductsPage() {
      const response = await fetch('https://catalog.example.test/products', { cache: 'no-store' });
      const products = await response.json();
      return <ProductList products={products} />;
    }
metadata:
  provenance:
    kind: synthetic
    origin: Next.js data fetching documentation
    revision_reason: Replaced a generic no-store performance preference with a clean freshness control.
  difficulty: ADVERSARIAL
  domains: [caching, freshness]
  adjudication:
    status: reviewed
    method: Source-and-context rule adjudication
    reviewer: codex-test-builder-review
    reviewed_on: '2026-09-19'
    sources:
      - url: https://nextjs.org/docs/app/building-your-application/data-fetching/fetching
        supports: Next.js supports cache configuration for fetch requests.
    notes: The stated requirement supports no-store for this route.
    excluded_claims: [PPR, tags, and broader catalog caching policy are not scored.]
