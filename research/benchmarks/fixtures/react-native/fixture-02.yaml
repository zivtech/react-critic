schema_version: 2
id: rn-02
category: list-performance
description: A FlatList supplies stable keys and relies on documented defaults.
intentional_clean: true
public:
  file_path: src/NotificationList.tsx
  language: TypeScript JSX
  frameworks:
    react-native: '0.76'
  runtime: hermes
  assumptions:
    - Every notification has a stable id.
    - Notification rows have variable height and do not need programmatic scrollToIndex.
  requirements: []
  code: |
    function NotificationList({ notifications, loadMore }) {
      return (
        <FlatList
          data={notifications}
          keyExtractor={(item) => item.id}
          renderItem={({ item }) => <NotificationRow item={item} />}
          onEndReached={loadMore}
          onEndReachedThreshold={0.5}
        />
      );
    }
