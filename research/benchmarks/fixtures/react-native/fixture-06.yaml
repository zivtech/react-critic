schema_version: 2
id: rn-06
category: gesture-handling
description: A custom checkout flow has no Android hardware-back handling.
intentional_clean: false
public:
  file_path: src/CheckoutFlow.tsx
  language: TypeScript JSX
  frameworks:
    react-native: '0.76'
  runtime: hermes
  assumptions:
    - CheckoutFlow owns the custom multi-step screen state.
    - Android hardware back reaches this component before navigation exits the screen.
  requirements:
    - Android hardware back at steps two and three must return to the preceding checkout step.
  code: |
    function CheckoutFlow({ onComplete }) {
      const [step, setStep] = useState(1);
      const nextStep = () => setStep((current) => Math.min(current + 1, 3));
      const prevStep = () => setStep((current) => Math.max(current - 1, 1));

      return (
        <View>
          <StepIndicator current={step} />
          {step === 1 && <CartReview onNext={nextStep} />}
          {step === 2 && <PaymentForm onNext={nextStep} onBack={prevStep} />}
          {step === 3 && <Confirmation onComplete={onComplete} />}
        </View>
      );
    }
metadata:
  provenance:
    kind: synthetic
    origin: React Native BackHandler documentation
    revision_reason: Added explicit navigation ownership and required Android behavior.
  difficulty: HAS-BUGS
  domains: [navigation, gestures]
  adjudication:
    status: reviewed
    method: Source-and-context rule adjudication
    reviewer: codex-test-builder-review
    reviewed_on: '2026-09-19'
    sources:
      - url: https://reactnative.dev/docs/backhandler
        supports: BackHandler can handle Android hardware back presses.
    notes: The source supplies only an in-flow back button and no Android hardware-back handling.
    excluded_claims: [Confirmation dialogs, iOS gestures, and global navigator behavior are not scored.]
issues:
  - id: rn-06-missing-hardware-back
    rule_id: react-native.gesture-handling
    category: gesture-handling
    severity: MAJOR
    description: The custom flow has no handling for the required Android hardware-back transition to the previous step.
    evidence_spans:
      - lines: [1, 4, 10, 11]
        rationale: prevStep is only wired to PaymentForm and no hardware-back handler is shown.
