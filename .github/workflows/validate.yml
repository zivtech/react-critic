name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --fail-under=80
      - run: python3 scripts/verify_no_copied_skills.py
        # Note: add --verify-content for full content integrity checks;
        # omitted by default to avoid CI dependency on GitHub raw content availability.
      - run: python3 -m unittest discover
      - name: Detect external-skill input changes
        id: external_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          if git diff --name-only "$base" HEAD -- \
            '.claude/skills/*/references/external-skills-manifest.json' \
            '.claude/skills/shared-js-core/references/external-skills-lock.json' \
            '.claude/skills/shared-js-core/scripts/**' \
            'scripts/refresh_external_skills.py' \
            'scripts/verify_no_copied_skills.py' \
            'scripts/skill_security.py' | grep -q .; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify locked upstream content
        if: steps.external_changes.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_no_copied_skills.py --verify-content
